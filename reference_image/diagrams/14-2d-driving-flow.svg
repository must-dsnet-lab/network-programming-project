<text x="839" y="1228" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">看门狗 500 ms／TLS 急停：归零锁存</text>
<text x="839" y="1263" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">持有者断开：撤权、清目标并归零</text>
<text x="839" y="1298" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">用户版显式复位后再申请、再应用</text>
