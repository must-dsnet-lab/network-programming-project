<text x="61" y="669" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#984913" text-anchor="start">本地模拟  ·  普通 UDP</text>
<text x="61" y="707" font-family="Consolas, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a2c44" text-anchor="start">DesktopConsole.send_control()</text>
<text x="61" y="742" font-family="Consolas, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a2c44" text-anchor="start">send_target() → UDP v1 / drive_input</text>
<text x="61" y="777" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">直接发往本机模拟车端</text>
<rect x="724" y="629" width="614" height="183" rx="14" fill="#fcf1e8" stroke="#984913" stroke-width="1.5"/>
<text x="743" y="669" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#984913" text-anchor="start">用户版  ·  TLS 授权与签名 UDP</text>
<text x="743" y="707" font-family="Consolas, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a2c44" text-anchor="start">ExpertControlWorker.apply_target()</text>
