<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1620" viewBox="0 0 1380 1620" role="img" aria-labelledby="title description">
<title id="title">图 14｜二维驾驶运行链路</title>
<desc id="description">操纵输入由 Qt 定时采样。本地模拟使用普通 UDP，用户版通过 TLS 管理授权并发送签名控制。车端依据有效目标步进运动或施加零速保护，再回传遥测。</desc>
<rect x="0" y="0" width="1380" height="1620" rx="0" fill="#f5f8fc" stroke="none" stroke-width="1.4"/>
<text x="42" y="42" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#4b6077" text-anchor="start">图 14  /  虚拟小车 · U4–U5</text>
<text x="42" y="105" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="55" font-weight="700" fill="#1a2c44" text-anchor="start">二维驾驶运行链路</text>
<text x="42" y="147" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#4b6077" text-anchor="start">从摇杆和踏板到车端步进，再由遥测回到桌面。</text>
<polyline points="42,184 81,184" fill="none" stroke="#205c9c" stroke-width="3.6" stroke-linejoin="round"/>
<polygon points="81.00,184.00 72.00,188.00 72.00,180.00" fill="#205c9c"/>
<text x="93" y="192" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#205c9c" text-anchor="start">TLS 管理</text>
<polyline points="276,184 315,184" fill="none" stroke="#984913" stroke-width="3.6" stroke-linejoin="round"/>
<polygon points="315.00,184.00 306.00,188.00 306.00,180.00" fill="#984913"/>
<text x="327" y="192" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#984913" text-anchor="start">UDP 控制</text>
<polyline points="510,184 549,184" fill="none" stroke="#644393" stroke-width="3.6" stroke-linejoin="round"/>
<polygon points="549.00,184.00 540.00,188.00 540.00,180.00" fill="#644393"/>
<text x="561" y="192" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#644393" text-anchor="start">车端步进</text>
<polyline points="744,184 783,184" fill="none" stroke="#9a3849" stroke-width="3.6" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="783.00,184.00 774.00,188.00 774.00,180.00" fill="#9a3849"/>
<text x="795" y="192" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#9a3849" text-anchor="start">撤权或保护</text>
<polyline points="1034,184 1073,184" fill="none" stroke="#096a64" stroke-width="3.6" stroke-linejoin="round"/>
<polygon points="1073.00,184.00 1064.00,188.00 1064.00,180.00" fill="#096a64"/>
<text x="1085" y="192" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#096a64" text-anchor="start">UDP 遥测</text>
<rect x="42" y="221" width="614" height="174" rx="14" fill="#ffffff" stroke="#1a2c44" stroke-width="1.5"/>
<text x="61" y="261" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#1a2c44" text-anchor="start">操纵输入</text>
<text x="61" y="299" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">摇杆／踏板 · 按键 A / D / W / S</text>
<text x="61" y="334" font-family="Consolas, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a2c44" text-anchor="start">DrivingControls._publish_input()</text>
<text x="61" y="369" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">松开回中／归零，摇杆保留 8% 死区</text>
<rect x="724" y="221" width="614" height="174" rx="14" fill="#ffffff" stroke="#1a2c44" stroke-width="1.5"/>
<text x="743" y="261" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#1a2c44" text-anchor="start">桌面 Qt 采样与提交</text>
<text x="743" y="299" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">「开始／应用」→ start_control() 启用采样</text>
<text x="743" y="334" font-family="Consolas, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a2c44" text-anchor="start">_sample_driving_input() → input_value()</text>
<text x="743" y="369" font-family="Consolas, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a2c44" text-anchor="start">每 50 ms，变化时 _apply_motion_intent()</text>
<polyline points="656,307 724,307" fill="none" stroke="#1a2c44" stroke-width="3.6" stroke-linejoin="round"/>
<polygon points="724.00,307.00 715.00,311.00 715.00,303.00" fill="#1a2c44"/>
<rect x="42" y="423" width="614" height="162" rx="14" fill="#fcf1e8" stroke="#984913" stroke-width="1.5"/>
<text x="61" y="463" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#984913" text-anchor="start">窗口失焦／正常停车</text>
<text x="61" y="501" font-family="Consolas, Microsoft YaHei UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a2c44" text-anchor="start">stop_motion() → _disarm_driving()</text>
<text x="61" y="536" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">提交全刹输入，再次操作需重新应用</text>
<text x="61" y="571" font-family="Microsoft YaHei, Microsoft YaHei UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#1a2c44" text-anchor="start">制动提交失败则停发</text>
