[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dsnet-rover"
version = "0.1.0"
description = "Virtual rover network control course project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rover", "rover.*"]
